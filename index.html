<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa com KML e Centro ACP Porto</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAhgWAucfyRTDqXln0dftErm_cCK_tAw_U"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { margin: 0; }
        .gm-style-cc, .gm-style-mtc { display: none !important; }

        #map { height: 700px; width: 100%; position: relative; }

        .map-buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }
        .map-buttons button {
            padding: 12px;
            font-size: 22px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .map-buttons button:hover { background-color: #0056b3; }
        .map-buttons button:active { background-color: #004085; }

        .instructions-btn { background-color: #28a745 !important; }
        .instructions-btn:hover { background-color: #218838 !important; }
        .instructions-btn:active { background-color: #1e7e34 !important; }

        #legend {
            background-color: #ffffff;
            padding: 25px;
            border: 2px solid #ddd;
            font-family: Arial, sans-serif;
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 350px;
            max-width: 90%;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: none;
            text-align: left;
            font-size: 16px;
            color: #333;
        }
        #legend h3 { margin-top: 0; font-size: 20px; color: #007bff; text-align: center; }
        #legend ul { list-style: none; padding-left: 0; margin: 15px 0; }
        #legend li { font-size: 14px; margin-bottom: 15px; color: #666; display: flex; align-items: center; }
        #legend li i { margin-right: 10px; font-size: 20px; color: #007bff; }
        #legend .note { font-size: 14px; color: #777; text-align: center; font-style: italic; }

        .close-btn {
            font-size: 20px;
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            border: none;
            color: #888;
            cursor: pointer;
        }
        .close-btn:hover { color: #333; }

        /* Aviso de erro do KML */
        #kml-status {
            display: none;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
    <script>
      var map;
      var markers = [];

      // URL do ficheiro KMZ alojado no GitHub Pages (muda o nome se for diferente)
      var KML_URL = 'https://loldrivingpt.github.io/KMZACPPorto2026/ACPPorto2026.kmz';

      function initMap() {
        map = new google.maps.Map(document.getElementById('map'), {
          zoom: 15,
          center: { lat: 41.1622, lng: -8.6210 },
          styles: [
            { "elementType": "geometry", "stylers": [{ "color": "#f5f5f5" }] },
            { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
            { "elementType": "labels.text.fill", "stylers": [{ "color": "#616161" }] },
            { "elementType": "labels.text.stroke", "stylers": [{ "color": "#f5f5f5" }] },
            { "featureType": "administrative.land_parcel", "elementType": "labels.text.fill", "stylers": [{ "color": "#bdbdbd" }] },
            { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
            { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] },
            { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#9e9e9e" }] },
            { "featureType": "transit", "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
            { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#c9c9c9" }] },
            { "featureType": "water", "elementType": "labels.text.fill", "stylers": [{ "color": "#9e9e9e" }] }
          ],
          fullscreenControl: true,
          mapTypeControl: false,
          streetViewControl: true,
          rotateControl: false,
          scaleControl: false,
          zoomControl: true,
          zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
        });

        // Carregar o KMZ
        var kmlLayer = new google.maps.KmlLayer({
          url: KML_URL,
          map: map,
          preserveViewport: true
        });

        kmlLayer.addListener('status_changed', function () {
          var status = kmlLayer.getStatus();
          console.log('Estado do KML:', status);
          var box = document.getElementById('kml-status');
          if (status !== 'OK') {
            box.textContent = 'Não foi possível carregar o KMZ (' + status + ').';
            box.style.display = 'block';
          } else {
            box.style.display = 'none';
          }
        });

        loadMarkersFromStorage();

        google.maps.event.addListener(map, 'click', function (event) {
          addMarker(event.latLng);
        });

        createLegend();
      }

      function addMarker(location, skipSave) {
        var marker = new google.maps.Marker({
          position: location,
          map: map,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: '#0000FF',
            fillOpacity: 1,
            strokeColor: '#FFFFFF',
            strokeWeight: 2,
            scale: 6
          }
        });
        markers.push(marker);
        if (!skipSave) saveMarkersToStorage();
      }

      function clearAllMarkers() {
        for (var i = 0; i < markers.length; i++) {
          markers[i].setMap(null);
        }
        markers = [];
        try { localStorage.removeItem('markers'); } catch (e) {}
      }

      function deleteLastMarker() {
        if (markers.length > 0) {
          var marker = markers.pop();
          marker.setMap(null);
          saveMarkersToStorage();
        }
      }

      function saveMarkersToStorage() {
        try {
          var markerPositions = markers.map(function (marker) {
            return marker.getPosition().toJSON();
          });
          localStorage.setItem('markers', JSON.stringify(markerPositions));
        } catch (e) {}
      }

      function loadMarkersFromStorage() {
        try {
          var markerPositions = JSON.parse(localStorage.getItem('markers'));
          if (markerPositions) {
            markerPositions.forEach(function (position) {
              addMarker(new google.maps.LatLng(position.lat, position.lng), true);
            });
          }
        } catch (e) {}
      }

      function createLegend() {
        var legend = document.createElement('div');
        legend.id = 'legend';
        var legendContent = '<h3>Instruções</h3>';
        legendContent += '<ul>';
        legendContent += '<li><i class="fas fa-map-marker-alt"></i><span><strong>Adicionar marcador:</strong> Clique no mapa fora dos waypoints existentes para adicionar uma bolinha azul.</span></li>';
        legendContent += '<li><i class="fas fa-trash"></i><span><strong>Apagar todos os marcadores:</strong> Clique para remover todos os marcadores do mapa.</span></li>';
        legendContent += '<li><i class="fas fa-backspace"></i><span><strong>Apagar último marcador:</strong> Clique para apagar o último marcador adicionado.</span></li>';
        legendContent += '</ul>';
        legendContent += '<p class="note">Estas bolinhas ajudam a identificar os pontos que já foram visualizados no mapa.</p>';
        var closeButton = '<button class="close-btn" onclick="toggleLegend()">&times;</button>';
        legend.innerHTML = legendContent + closeButton;
        document.body.appendChild(legend);
      }

      function toggleLegend() {
        var legend = document.getElementById('legend');
        legend.style.display = (legend.style.display === 'block') ? 'none' : 'block';
      }
    </script>
</head>
<body onload="initMap()">
    <div id="map"></div>
    <div id="kml-status"></div>
    <div class="map-buttons">
        <button onclick="clearAllMarkers()" title="Apagar todos"><i class="fas fa-trash"></i></button>
        <button onclick="deleteLastMarker()" title="Apagar último"><i class="fas fa-backspace"></i></button>
        <button class="instructions-btn" onclick="toggleLegend()" title="Instruções"><i class="fas fa-question-circle"></i></button>
    </div>
</body>
</html>
